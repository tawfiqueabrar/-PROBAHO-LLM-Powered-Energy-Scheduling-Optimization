# Fly.io configuration — https://fly.io/docs/reference/configuration/
#
# Quick start:
#   brew install flyctl   # or scoop install flyctl
#   fly auth signup
#   fly launch --copy-config --name gridwise-energy
#   fly secrets set OPENAI_API_KEY=sk-...
#   fly deploy

app = "gridwise-energy"
primary_region = "sin"   # closest to Bangladesh (Singapore); change to e.g. "iad" or "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENAI_MODEL = "gpt-4o-mini"
  PORT = "8000"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

  [[services.tls_checks]]
    interval = "1h"
    timeout = "5s"

[metrics]
  port = 8000
  path = "/metrics"

[deploy]
  release_command = "echo 'no release step'"
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
