name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache PuLP/CBC apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ubuntu-apt-${{ runner.os }}

      - name: Install system deps (PuLP/CBC build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run pytest
        env:
          # Don't gate CI on the LLM being configured.
          # The optimizer is fully deterministic and the interpreter
          # falls back to a deterministic keyword matcher when no key is set.
          OPENAI_API_KEY: ""
        run: pytest -v

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            **/test_*.py
